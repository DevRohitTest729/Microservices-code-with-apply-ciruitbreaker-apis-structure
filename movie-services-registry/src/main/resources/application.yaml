server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:movie-services-registry}

eureka:
  client:
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:false}


management:
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      probes:
        enabled: true

  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true

