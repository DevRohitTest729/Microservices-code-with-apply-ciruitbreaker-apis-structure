server:
  port: ${SERVER_PORT:8765}

spring:
  application:
    name: ${APPLICATION_NAME:api-gateway}
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/bookings/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: booking-route
                    fallbackUri: forward:/booking-fallback

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notifications/**

eureka:
  client:
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      probes:
        enabled: true

  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true
